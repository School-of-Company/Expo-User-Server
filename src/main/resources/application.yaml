spring:
  application:
    name: expo-user-server
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
          # 인증번호 문자 발송은 외부 문자 게이트웨이를 기다려 기본 읽기 제한보다 오래 걸릴 수 있다
          expo-notification-server:
            connect-timeout: 2000
            read-timeout: 10000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo_user}
    username: ${DB_USERNAME:expo_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_SURVEY_ANSWER_GROUP_ID:expo-user-server.survey-answer}
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
jwt:
  private-key: ${JWT_PRIVATE_KEY}
  access-token-ttl: 15m
  refresh-token-ttl: 7d
internal:
  token: ${INTERNAL_TOKEN}
bootstrap-admin:
  nickname: ${BOOTSTRAP_ADMIN_NICKNAME:}
survey-answer:
  submit-topic: ${KAFKA_SURVEY_ANSWER_SUBMIT_TOPIC:survey.answer.submit}
  result-topic: ${KAFKA_SURVEY_ANSWER_RESULT_TOPIC:survey.answer.result}
  dead-letter-topic: ${KAFKA_SURVEY_ANSWER_DEAD_LETTER_TOPIC:survey.answer.submit.dlt}
  consumer:
    auto-startup: true
clients:
  expo:
    url: ${EXPO_URL:}
    internal-token: ${EXPO_INTERNAL_TOKEN}
  notification:
    url: ${NOTIFICATION_URL:}
qr-sms-sent:
  topic: ${KAFKA_QR_SMS_SENT_TOPIC:notification.qr-sms.sent}
  dead-letter-topic: ${KAFKA_QR_SMS_SENT_DEAD_LETTER_TOPIC:notification.qr-sms.sent.dlt}
  group-id: ${KAFKA_QR_SMS_SENT_GROUP_ID:expo-user-server.qr-sms-sent}
  consumer:
    auto-startup: true
registration-events:
  registered-topic: ${KAFKA_REGISTRATION_REGISTERED_TOPIC:user.participant.registered}
  standard-created-topic: ${KAFKA_REGISTRATION_STANDARD_CREATED_TOPIC:user.standard-participant.created}
  relay:
    enabled: true
    interval-ms: 2000
participant-session:
  ttl: ${PARTICIPANT_SESSION_TTL:30m}
  used-code-ttl: ${PARTICIPANT_OTP_USED_TTL:10m}
  cookie-name: ${PARTICIPANT_SESSION_COOKIE_NAME:PARTICIPANT_SESSION}
  secure: ${PARTICIPANT_SESSION_COOKIE_SECURE:true}
  same-site: ${PARTICIPANT_SESSION_COOKIE_SAME_SITE:Lax}
  domain: ${PARTICIPANT_SESSION_COOKIE_DOMAIN:}
# 문서는 SWAGGER_ENABLED=true일 때만 연다(기본은 꺼짐). Gateway는 경로 접두사로만 서비스를 찾아서 문서를 /auth 접두사 아래에 둔다.
# /internal 하위 경로는 SWAGGER_INCLUDE_INTERNAL=true일 때만 문서에 넣는다(기본은 뺌)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /auth/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /auth/swagger-ui.html
swagger:
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}
