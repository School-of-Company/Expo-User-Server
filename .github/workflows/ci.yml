name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 형식 검증
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^\[(auth|user|training|participation|admin|trainee|participant|global|ci/cd)\]\ .+ ]]; then
            echo "PR 제목은 '[scope] description' 형식이어야 합니다 (scope: auth/user/training/participation/admin/trainee/participant/global/ci-cd)." >&2
            echo "main으로 가는 릴리즈 PR은 'vX.Y.Z' 형식도 허용됩니다." >&2
            echo "현재 제목: $TITLE" >&2
            exit 1
          fi

  # ktlint는 소스만 검사하고 컴파일이 필요 없어서, 테스트와 나눠 병렬로 돌려도 컴파일이 중복되지 않는다
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      - name: ktlint 검사
        run: ./gradlew ktlintCheck

  # 빌드는 테스트가 컴파일해 둔 결과를 그대로 써서 jar 패키징만 하므로 같은 잡에서 이어 실행한다
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      - name: 테스트
        run: ./gradlew test

      - name: 빌드
        run: ./gradlew build -x test -x ktlintCheck

  notify-discord:
    needs: [lint, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림 전송
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: Expo User CI
          content: |
            <@${{ secrets.DISCORD_USER_ID_1 }}> <@${{ secrets.DISCORD_USER_ID_2 }}>
            확인해주세요.
